name: Web quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-check
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-browser
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  harness-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify --group structural
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-windows
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
