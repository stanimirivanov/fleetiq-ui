name: Web quality gate
run-name: FleetIQ PR ${{ github.event.pull_request.number }} from ${{ github.event.pull_request.head.sha }} to ${{ github.event.pull_request.base.ref }} at ${{ github.sha }}
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7 # v7.1.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:install
      - run: pnpm check
      - name: Inspect artifacts before retention
        id: artifacts
        if: always()
        run: pnpm security:artifacts
      - name: Upload bounded verification evidence
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: verification-check
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  browser:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7 # v7.1.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dependencies:qualify --group browser
      - name: Inspect artifacts before retention
        id: artifacts
        if: always()
        run: pnpm security:artifacts
      - name: Upload bounded verification evidence
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: verification-browser
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload inspected synthetic browser failure evidence
        if: failure() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  browser-quality:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7 # v7.1.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dependencies:qualify --group browser-quality
      - name: Inspect artifacts before retention
        id: artifacts
        if: always()
        run: pnpm security:artifacts
      - name: Upload bounded verification evidence
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: verification-browser-quality
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload inspected synthetic browser failure evidence
        if: failure() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: playwright-quality-failure-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  image:
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm image:qualify
      - run: pnpm security:artifacts
        id: artifacts
        if: always()
      - uses: actions/upload-artifact@v7
        if: always() && steps.artifacts.outcome == 'success'
        with:
          name: ux-image-qualification
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always() && steps.artifacts.outcome == 'success'
        with:
          name: ux-image-reports
          path: dist/image-reports/
          if-no-files-found: ignore
          retention-days: 7
