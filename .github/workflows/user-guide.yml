name: User guide
on:
  workflow_run:
    workflows: [Web quality gate]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleetiq-user-guide-pages
  cancel-in-progress: true
jobs:
  build:
    name: Qualify and build complete executable user guide
    # Both triggers rerun every gate at the exact source revision. Never publish a fork/PR run.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out publication revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:install
      - run: pnpm exec playwright install --with-deps chromium
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Qualify publication revision
        run: pnpm check
      - name: Qualify browser behavior at publication revision
        run: pnpm e2e
      - name: Qualify measured browser quality at publication revision
        run: pnpm verify --group browser-quality
      - name: Generate only synthetic and contract-mocked journeys
        run: pnpm guide:generate
      - name: Validate exact-source release evidence
        run: pnpm guide:release --require-clean
      - name: Inspect artifacts before retention
        id: artifacts
        if: always()
        run: pnpm security:artifacts
      - name: Upload qualified GitHub Pages artifact
        if: success() && steps.artifacts.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/user-guide
      - name: Upload bounded verification evidence
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verification-guide
          path: .verification/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload inspected synthetic guide failure evidence
        if: failure() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-user-guide-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    name: Publish qualified executable user guide
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
